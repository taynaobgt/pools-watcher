# File nay can dat tai: .github/workflows/watch-pools.yml trong repo GitHub cua ban
#
# Thiet lap truoc khi dung:
# 1. Tao 1 repo GitHub (public hoac private deu duoc)
# 2. Copy file nay vao:      .github/workflows/watch-pools.yml
# 3. Copy pools_watcher_bot_gha.py vao thu muc goc repo, doi ten thanh: watch.py
# 4. Vao Settings -> Secrets and variables -> Actions -> New repository secret, them:
#      TELEGRAM_BOT_TOKEN = <token bot cua ban>
#      TELEGRAM_CHAT_ID   = <chat id cua ban>
#    (tuy chon) neu muon doi chu ky bao cao dinh ky khac 60 phut, them them secret hoac
#    sua truc tiep bien env STATUS_REPORT_INTERVAL_MINUTES trong step "Run watcher" ben duoi.
# 5. Vao Settings -> Actions -> General -> Workflow permissions -> chon
#    "Read and write permissions" (de workflow duoc phep commit state.json nguoc lai repo)
# 6. Commit & push. Vao tab "Actions" tren GitHub de xem workflow chay.
#    Co the bam "Run workflow" de chay thu ngay lap tuc.
#
# LUU Y VE BAO CAO DINH KY:
# Script co tinh nang gui "bao cao dinh ky" moi STATUS_REPORT_INTERVAL_MINUTES phut
# (mac dinh 60 phut), du co thay doi hay khong. Vi GitHub Actions khong chay lien tuc
# ma chi duoc "danh thuc" theo lich cron, workflow ben duoi duoc dat chay moi 5 phut
# de dam bao khong bi le qua xa moc 60 phut khi den han bao cao.

name: Watch pools.trade
# cron re-registered 2026-08-03
on:
  schedule:
    # Chay moi 5 phut (cu phap cron chuan UTC). Chu ky nay CHI de kiem tra thay doi
    # va "danh thuc" job kip thoi gian bao cao dinh ky 60 phut/lan (cau hinh o duoi).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # cho phep bam "Run workflow" de chay thu cong

# Tranh 2 lan chay chong len nhau neu 1 lan chay truoc bi cham
concurrency:
  group: watch-pools
  cancel-in-progress: false

permissions:
  contents: write   # can quyen ghi de commit lai state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_URL: "https://pools.trade/"
          STATUS_REPORT_INTERVAL_MINUTES: "60"
        run: python watch.py

      - name: Commit updated state (neu co thay doi)
        run: |
          git config user.name "pools-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "chore: update watcher state [skip ci]"
            git push
          else
            echo "Khong co thay doi state.json, bo qua commit."
          fi
